# Pipeline GitHub Actions du dépôt iOS (l'Android vit dans sonnuage-android).
#  - ios     : .app non signé empaqueté en .ipa (sonnuage-X.Y.Z-unsigned.ipa)
#  - release : sur tag vX.Y.Z, release GitHub avec l'IPA
#
# Les pages viennent des sources du dépôt sonnuage, extrait à côté de celui-ci (../sonnuage), plutôt que du paquet
# NuGet : pas de registre à authentifier. Dépôt privé : définir le secret SONNUAGE_REPO_TOKEN (jeton en lecture).
# Branche ou tag du dépôt sonnuage : main par défaut, modifiable au lancement manuel.
#
#  - ios     : .app non signé empaqueté en sonnuage-X.Y.Z-unsigned.ipa (runner macOS, aucun compte Apple requis).
#              À signer ensuite avec un Apple ID gratuit (Sideloadly, AltStore) : voir docs/IOS.md.
#
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Branche ou tag du dépôt sonnuage
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  ios:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sonnuage-ios
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sonnuage
          ref: ${{ inputs.server_ref || 'main' }}
          token: ${{ secrets.SONNUAGE_REPO_TOKEN || github.token }}
          path: sonnuage
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: sonnuage-ios/global.json
      - name: Xcode le plus récent
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode : $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Workload MAUI iOS
        run: dotnet workload install maui-ios
      - name: Build (non signé)
        working-directory: sonnuage-ios
        env:
          VERSION: ${{ steps.v.outputs.value }}
        run: |
          dotnet build src/SonNuage.Mobile/SonNuage.Mobile.csproj -p:TargetFrameworks=net10.0-ios -c Release \
            -p:SonNuageRepo="$GITHUB_WORKSPACE/sonnuage" -p:RuntimeIdentifier=ios-arm64 \
            -p:Version="$VERSION" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:ValidateXcodeVersion=false
          app=$(find src/SonNuage.Mobile/bin/Release -name '*.app' -type d -maxdepth 5 | head -1)
          test -n "$app" || { echo "Aucun .app produit" >&2; exit 1; }
          mkdir -p dist/Payload && cp -R "$app" dist/Payload/
          (cd dist && zip -qry "sonnuage-$VERSION-unsigned.ipa" Payload && rm -rf Payload)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sonnuage-ios
          path: sonnuage-ios/dist/
          retention-days: 30

  release:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sonnuage-ios
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipa --repo "$GITHUB_REPOSITORY" --title "SonNuage iOS ${{ needs.ios.outputs.version }}" --generate-notes
