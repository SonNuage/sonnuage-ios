# Pipeline GitHub Actions du dépôt iOS (l'Android vit dans sonnuage-android).
#  - ios     : .app non signé empaqueté en sonnuage-X.Y.Z-unsigned.ipa (runner macOS, aucun compte Apple requis).
#              À signer ensuite avec un Apple ID gratuit (Sideloadly, AltStore) : voir docs/IOS.md.
#  - release : sur tag vX.Y.Z, release GitHub avec l'IPA
#
# Les pages viennent des sources du dépôt sonnuage, extrait à côté de celui-ci (../sonnuage), plutôt que du paquet
# NuGet : pas de registre à authentifier. Dépôt privé : définir le secret SONNUAGE_REPO_TOKEN (jeton en lecture).
# Branche ou tag du dépôt sonnuage : main par défaut, modifiable au lancement manuel.
#
# Le runner macOS propose plusieurs Xcode ; certaines installations sont instables (xcrun échoue au hasard avec
# « Invalid argument »). La matrice essaie plusieurs Xcode en parallèle ; fail-fast désactivé pour voir tous les résultats.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Branche ou tag du dépôt sonnuage
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  ios:
    name: ios (${{ matrix.xcode }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        xcode: [Xcode.app, Xcode_26.6.app, Xcode_26.6.0.app, Xcode_26.5.app, Xcode_26.5.0.app]
    outputs:
      version: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sonnuage-ios
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sonnuage
          ref: ${{ inputs.server_ref || 'main' }}
          token: ${{ secrets.SONNUAGE_REPO_TOKEN || github.token }}
          path: sonnuage
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
      - uses: actions/setup-dotnet@v4
        with:
          # Bande 3xx : son workload iOS vise un iOS que les Xcode du runner fournissent (la 4xx vise iOS 27).
          dotnet-version: 10.0.3xx
      - name: Workload MAUI iOS
        working-directory: sonnuage-ios
        run: dotnet workload install maui-ios
      - name: Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/${{ matrix.xcode }}"
          xcodebuild -version
      - name: Build (non signé)
        shell: bash
        working-directory: sonnuage-ios
        env:
          VERSION: ${{ steps.v.outputs.value }}
        run: |
          dotnet build src/SonNuage.Mobile/SonNuage.Mobile.csproj -p:IosOnly=true -c Release \
            -p:SonNuageRepo="$GITHUB_WORKSPACE/sonnuage" \
            -p:Version="$VERSION" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:ValidateXcodeVersion=false \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          app=$(find src/SonNuage.Mobile/bin/Release -maxdepth 5 -name '*.app' -type d | head -1)
          test -n "$app" || { echo "Aucun .app produit" >&2; exit 1; }
          mkdir -p dist/Payload && cp -R "$app" dist/Payload/
          (cd dist && zip -qry "sonnuage-$VERSION-unsigned.ipa" Payload && rm -rf Payload)
          ls -lh dist
      - name: Diagnostic (résumé du run)
        if: always()
        run: |
          {
            echo '### Diagnostic iOS (${{ matrix.xcode }})'
            echo '```'
            xcodebuild -version
            xcodebuild -showsdks | grep -i iphoneos || true
            ls -d /Applications/Xcode*.app
            dotnet --version
            dotnet workload list
            ls "${DOTNET_ROOT:-$HOME/.dotnet}/packs" | grep -i 'ios' || true
            echo '--- fin du journal de build'
            tail -40 "$RUNNER_TEMP/build.log" 2>/dev/null || true
            echo '--- erreurs du build'
            grep -E "error|Error" "$RUNNER_TEMP/build.log" 2>/dev/null | sort -u | head -15 || true
            echo '--- contenu de bin'
            find sonnuage-ios/src/SonNuage.Mobile/bin -maxdepth 4 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sonnuage-ios-${{ matrix.xcode }}
          path: sonnuage-ios/dist/
          retention-days: 30

  release:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sonnuage-ios-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipa --repo "$GITHUB_REPOSITORY" --title "SonNuage iOS ${{ needs.ios.outputs.version }}" --generate-notes
